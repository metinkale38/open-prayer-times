name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  version:
    name: Determine version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      is_tagged: ${{ steps.release.outputs.is_tagged }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Calculate semantic version
        id: version
        uses: paulhatch/semantic-version@v6
        with:
          tag_prefix: "v"
          version_format: "${major}.${minor}.${patch}"
          major_pattern: "/!:|BREAKING CHANGE:/"
          minor_pattern: "/feat(\\(.+\\))?:/"
          search_commit_body: true

      - name: Resolve release version
        id: release
        env:
          CALCULATED_VERSION: ${{ steps.version.outputs.version }}
          CALCULATED_TAG: ${{ steps.version.outputs.version_tag }}
          IS_TAGGED: ${{ steps.version.outputs.is_tagged }}
        run: |
          if ! git describe --tags --abbrev=0 --match 'v[0-9]*' >/dev/null 2>&1; then
            echo "No release tag found; starting at 1.0.0."
            echo "version=1.0.0" >> "$GITHUB_OUTPUT"
            echo "tag=v1.0.0" >> "$GITHUB_OUTPUT"
            echo "is_tagged=false" >> "$GITHUB_OUTPUT"
          else
            echo "version=${CALCULATED_VERSION}" >> "$GITHUB_OUTPUT"
            echo "tag=${CALCULATED_TAG}" >> "$GITHUB_OUTPUT"
            echo "is_tagged=${IS_TAGGED}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push release tag
        if: steps.release.outputs.is_tagged != 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists; nothing to do."
          else
            git tag -a "${TAG}" -m "Release ${TAG}"
            git push origin "${TAG}"
          fi

  publish-java:
    name: Publish Maven packages
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: ./gradlew build --no-daemon --stacktrace

      - name: Publish to GitHub Packages
        env:
          VERSION: ${{ needs.version.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          ./gradlew
          :calctimes:publish
          :client:publish
          :hijri:publish
          --no-daemon
          --stacktrace

  docker:
    name: Build and publish Docker image
    needs: [version, publish-java]
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/server
          tags: |
            type=semver,pattern={{version}},value=${{ needs.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.version.outputs.version }}
            type=semver,pattern={{major}},value=${{ needs.version.outputs.version }}
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile-server
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    name: Create GitHub release
    needs: [version, publish-java, docker]
    runs-on: ubuntu-latest

    steps:
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          make_latest: true
          generate_release_notes: true
          body: |
            ## Artifacts

            Maven (GitHub Packages):
            - `dev.metinkale:calctimes:${{ needs.version.outputs.version }}`
            - `dev.metinkale:client:${{ needs.version.outputs.version }}`
            - `dev.metinkale:hijri:${{ needs.version.outputs.version }}`

            Docker (GitHub Container Registry):
            - `ghcr.io/${{ github.repository }}/server:${{ needs.version.outputs.version }}`
            - `ghcr.io/${{ github.repository }}/server:latest`
