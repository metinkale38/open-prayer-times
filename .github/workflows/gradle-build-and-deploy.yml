name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && 'Github Packages Deployment' || '' }}
    steps:
    - uses: actions/checkout@v4

    - name: Build with Gradle
      run: ./gradlew build --no-daemon
